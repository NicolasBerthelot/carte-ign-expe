name: Create release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    # Réservé au dépôt IGNF (secrets de publication) : ne tourne pas dans les forks
    if: github.repository == 'IGNF/cartes-ign-app'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Create a Release
      uses: elgohr/Github-Release-Action@v5
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        title: ${{ github.ref_name }}
        tag: ${{ github.ref_name }}
